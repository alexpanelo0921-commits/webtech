<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .top{
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: large;
            
        }
        
        a {
            text-decoration: none;
        }

        .Site {
            display: flex;
            margin-top: 150px;
            justify-content: space-around;
            font-weight: bold;
            font-size: large;
        }

        button {
            border: none;
            padding: 15px;
            padding-left: 20px;
            padding-right: 20px;
            border-radius: 10px;
            box-shadow: 5px 5px 0px 5px;
            cursor: pointer;
            
        }

        .youtube{
            transition-duration: 0.4s;
        }
        .youtube:hover {
            background-color: red;
        }

        .google{
            transition-duration: 0.4s;
        }

        .google:hover{
            background-color: blue;
        }

         .github{
            transition-duration: 0.4s;
        }

        .github:hover{
            background-color: black;
        }

         .School{
            transition-duration: 0.4s;
        }

        .School:hover{
            background-color: green;
        }

    </style>
</head>
<body>
    <h1>
    <div class="top">
         <a href="index.html">About</a>
         <a href="home.html">Home</a>
         <a href="contact.html">Contact</a>
    </div>
    </h1>
    
   

    <div class="Site">
        <button class="google"><a href="https://www.google.com/?safe=active&ssui=on">Google</a></button>
        <button class="youtube"><a href="https://www.youtube.com/">Youtube</a></button>
        <button class="github"><a href="https://github.com/login">Github</a></button>
        <button class="School"><a href="https://www.uc-bcf.edu.ph/">School Website</a></button>
        
    </div>
    
</body>
</html>
